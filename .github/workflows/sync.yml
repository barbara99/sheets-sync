name: Sync Sheets

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ping Railway to keep it awake
        run: curl https://sheets-sync-production.up.railway.app/

      - name: Full sync to catch any missed edits
        run: |
          curl -X POST https://sheets-sync-production.up.railway.app/sync
